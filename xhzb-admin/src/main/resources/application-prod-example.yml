# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 9000
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.xhzb: debug
    org.springframework: warn
    org.springframework.ai: debug # AI对话的日志级别
    # 推荐配置：开启事务管理器的详细日志，用于观察事务的创建、提交和回滚[reference:6]
    org.springframework.orm.jpa.JpaTransactionManager: debug
    # 或者，如果你使用的是JDBC事务管理器，可以用下面这个配置[reference:7][reference:8]
    # org.springframework.jdbc.support.JdbcTransactionManager: debug

    # 更全面的配置：监控事务拦截器的行为，可以看到事务开始和完成的日志[reference:9]
    org.springframework.transaction.interceptor: trace

    # 全局事务相关日志，可以获得更全面的信息[reference:11]
    org.springframework.transaction: debug

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: false
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xhzb?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: YOUR_PROD_VALUE_HERE
  # redis 配置
  data:
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password: YOUR_PROD_VALUE_HERE
      # 连接超时时间
      timeout: 10s
      jedis:
        pool:
          enabled: true
# Redis-Stack 配置（向量存储）
redis-stack:
  host: localhost
  port: 6378
  password: YOUR_PROD_VALUE_HERE
# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.xhzb
